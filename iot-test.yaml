  on_connect:
    then:
      - lambda: |-
          if (id(owner_id).empty() || id(device_id).empty()) {
            ESP_LOGW("MQTT", "Owner or Device ID empty. Skipping OTA subscription.");
            return;
          }
  
          std::string OTA_topic = "cmd/" + id(owner_id) + "/" + id(device_id) + "/ota";
  
          id(my_mqtt).subscribe(OTA_topic, [](const std::string &topic, const std::string &payload) {
            ESP_LOGI("MQTT", "Message on %s: %s", topic.c_str(), payload.c_str());
  
            if (payload == "ota_true") {
              id(http_ota).execute();
            }
          });
  
          ESP_LOGI("MQTT", "Subscribed to %s", OTA_topic.c_str());

script:
  - id: provision_device
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(mqtt_token).empty() && !id(device_serial).empty() && !id(prov_secret).empty();'
          then:
            - logger.log: "Running Provisionong script"
            - http_request.post:
                url: http://192.168.0.104:8086/api/devices/provision
                request_headers:
                  Content-Type: application/json
                body: !lambda |-
                  return std::string("{\"serial_number\":\"") + id(device_serial) +
                         "\",\"prov_secret\":\"" + id(prov_secret) + "\"}";
                capture_response: true
                on_response:
                  then:
                    - if:
                        condition:
                          lambda: return response->status_code == 200;
                        then:
                          - lambda: |-
                              bool ok = false;
                              std::string owner, did, token;

                              json::parse_json(body, [&](JsonObject root) -> bool {
                                ok    = (bool)(root["success"] | false);
                                owner = (const char*)(root["owner_id"]    | "");
                                did   = (const char*)(root["device_id"]   | "");
                                token = (const char*)(root["device_token"]| "");
                                return true;
                              });

                              if (!ok || owner.empty() || did.empty() || token.empty()) {
                                ESP_LOGW("PROVISION", "Bad response: %s", body.c_str());
                                return;
                              }

                              id(owner_id)  = owner;
                              id(device_id) = did;
                              id(mqtt_token)= token;

                              global_preferences->sync();

                              ESP_LOGI("PROVISION", "Owner ID: %s", id(owner_id).c_str());
                              ESP_LOGI("PROVISION", "Device ID: %s", id(device_id).c_str());
                              ESP_LOGI("PROVISION", "mqtt token: %s", id(mqtt_token).c_str());

                              // Apply creds to ESPHome MQTT client
                              esphome::mqtt::global_mqtt_client->set_client_id(id(device_serial));
                              esphome::mqtt::global_mqtt_client->set_username(id(device_id));
                              esphome::mqtt::global_mqtt_client->set_password(id(mqtt_token));
                              
                              ESP_LOGI("PROVISION", "Starting Mqtt..");

                              // Start MQTT now
                              esphome::mqtt::global_mqtt_client->enable();

                        else:
                          - lambda: |-
                              ESP_LOGW("PROVISION", "HTTP %d: %s", response->status_code, body.c_str());
      


  - id: enable_mqtt_from_global
    then: 
      - if:
          condition:
            lambda: 'return !id(device_id).empty() && !id(mqtt_token).empty() && !id(device_serial).empty();'
          then:
            - lambda: |-
                 // Apply creds to ESPHome MQTT client
                 esphome::mqtt::global_mqtt_client->set_client_id(id(device_serial));
                 esphome::mqtt::global_mqtt_client->set_username(id(device_id));
                 esphome::mqtt::global_mqtt_client->set_password(id(mqtt_token));
                 // Start MQTT now
                 esphome::mqtt::global_mqtt_client->enable();

          else:
            - lambda: |-
                ESP_LOGW("MQTT", "Globals not ready. serial=%d device_id=%d token=%d",
                         !id(device_serial).empty(),
                         !id(device_id).empty(),
                         !id(mqtt_token).empty());

  - id: http_ota
    then: 
      - ota.http_request.flash:
          md5_url: https://pub-c7b3a70fb2ff4468bbcc864c8033a974.r2.dev/firmware/iot_test.md5
          url: https://pub-c7b3a70fb2ff4468bbcc864c8033a974.r2.dev/firmware/iot_test.bin
          
          