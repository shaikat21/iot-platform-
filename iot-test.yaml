esphome:
  name: iot-test
  friendly_name: iot_test
  on_boot:
    priority: 600
    then:
      - lambda: |-
          // write once, then it persists in NVS across reboots + OTA
          if (id(device_serial).empty()) id(device_serial) = std::string("${FACTORY_DEVICE_SERIAL}");
          if (id(prov_secret).empty())  id(prov_secret)  = std::string("${FACTORY_PROV_SECRET}");

esp32:
  board: esp32dev
  framework:
    type: esp-idf


preferences:
  flash_write_interval: 0s



# Enable logging
logger:

# Enable Home Assistant API
api:
  reboot_timeout: 0s
  encryption:
    key: "++UWH5VtW80SBIjaEancMjPcnvSr/XWh1dqldkHB9mA="

ota:
  - platform: esphome
    password: "6f1a968f67a45b20d7ecaf8cfc080e4c"
  - platform: http_request

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    then:
      - if:
          condition:
            lambda: 'return id(device_id).empty() || id(mqtt_token).empty();'
          then:
            - script.execute: provision_device
          else:
            - script.execute: enable_mqtt_from_global


  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Iot-Test Fallback Hotspot"
    password: "pass1234"

captive_portal:
    
http_request:
  useragent: iot-device-provision
  timeout: 10s

globals:
  # factory-injected (unique)
  - id: device_serial
    type: std::string
    restore_value: yes
    initial_value: ""
    max_restore_data_length: 64

  - id: prov_secret
    type: std::string
    restore_value: yes
    initial_value: ""
    max_restore_data_length: 128

 # From Backend
  - id: device_id
    type: std::string
    restore_value: yes
    initial_value: ""
    max_restore_data_length: 64

  - id: mqtt_token
    type: std::string
    restore_value: yes
    initial_value: ""
    max_restore_data_length: 128

  - id: owner_id
    type: std::string
    restore_value: yes
    initial_value: ""
    max_restore_data_length: 64


