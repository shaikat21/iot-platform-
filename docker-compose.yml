services:
  postgres:
    image: timescale/timescaledb:latest-pg17
    container_name: iot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iotpassword
      POSTGRES_DB: iotdb
    volumes:
      - ./backend/postgres/data:/var/lib/postgresql/data
    networks:
      - iot
    ports:
      - "5433:5432"

  emqx:
    image: emqx:5.7
    container_name: emqx
    restart: unless-stopped
    environment:
      EMQX_NODE__NAME: "emqx@emqx"
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: emqx123
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
    volumes:
      - ./backend/emqx/data:/opt/emqx/data
      - ./backend/emqx/log:/opt/emqx/log
      - /mnt/caddy-mqtt-cert/event.techsavvylab.com.crt:/opt/emqx/etc/certs/cert.pem:ro
      - /mnt/caddy-mqtt-cert/event.techsavvylab.com.key:/opt/emqx/etc/certs/key.pem:ro
      - /mnt/caddy-mqtt-cert/event.techsavvylab.com.crt:/opt/emqx/etc/certs/cacert.pem:ro
    networks:
      - iot
    ports:
      - "1883:1883"
      - "8083:8083"
      - "8883:8883"
      - "18083:18083"

  backend:
    build: ./backend
   # image: node:20
    container_name: iot-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://iot:iotpassword@postgres:5432/iotdb
      ZITADEL_ISSUER: https://your-zitadel-domain
      ZITADEL_AUDIENCE: iot-api
      MQTT_HOST: emqx
      MQTT_PORT: 1883
          # FIX FOR DOCKER RELOAD:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 300
    env_file:
      - backend/.env
    command: >
        sh -c "
          npm install -g nodemon &&
          nodemon --legacy-watch src/server.js
        "
    volumes:
      - ./backend:/app
      - /app/node_modules
#      - /app/node_modules
    depends_on:
      - postgres
      - emqx
    networks:
      - iot
    ports:
      - "8086:8081"

networks:
  iot:

volumes:
  iot_pg_data:
  emqx_data:
  emqx_log: